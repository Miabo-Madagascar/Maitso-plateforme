name: Deploy Node.js to Elastic Beanstalk

on:
  push:
    branches:
      - aws-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout aws-deploy branch
        uses: actions/checkout@v3
        with:
          ref: aws-deploy  # <-- ici tu forces la branche

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Zip seulement le contenu de la branche
      - name: Zip backend branch
        run: zip -r app.zip . -x '*.git*'

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ secrets.EB_APPLICATION }}
          environment_name: ${{ secrets.EB_ENVIRONMENT }}
          region: ${{ secrets.AWS_REGION }}
          deployment_package: app.zip
          wait_for_deployment: true
          use_existing_version_if_available: true
